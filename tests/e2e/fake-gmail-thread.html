<!doctype html>
<html><head><meta charset="utf-8"><title>Your password expires - teacher@school.org - Gmail</title>
<style>body{font:14px Arial;background:#fff}[gh=mtb] [role=button]{display:inline-block;padding:4px 8px;border:1px solid #ccc;margin:2px}</style></head>
<body>
<div gh="mtb">
  <div role="button" aria-label="Back to Inbox">Back</div>
  <div role="button" aria-label="Archive" act="7">Archive</div>
  <div role="button" aria-label="Report spam" data-tooltip="Report spam" act="9" id="spamBtn">Spam</div>
</div>
<div role="main" id="main"></div>
<script>
window.__spammed = [];
const P = new URLSearchParams(location.search);
const sender = P.get('from') || 'phisher@evil-scam.test';
const tid = P.get('t') || '2001';
const sname = P.get('name') || 'IT Support';
const cloud = P.get('links') === 'cloud';
// ?links=company: a company's newsletter whose link text shows its main site (test-companies.js):
// one link to its own ending (.amex), one to another domain of its; ?links=name: a company's name
// under another ending.
const LINKS = {
  company: 'Report phishing at <a id="own" href="https://go.amex/phishing-us??comm_track_id=1&dotAmexDomain=go">americanexpress.com/phishing</a>. ' +
           'Offers: <a id="other" href="https://www.aexp.com/offers">americanexpress.com/offers</a>.',
  name: 'Your order: <a id="name" href="https://www.amazon.de/gp/your-orders">amazon.com/orders</a>.',
  // ?links=service: a newsletter's link through the mail service that sent it, its text a brand's site (test-companies.js, [5.97-1]).
  service: 'This week\'s episode: listen on <a id="svc" href="https://link.mail.newsletter-service.example/v2/c/0a1b2c3d4e5f">open.spotify.com</a>.',
  // ?links=allred: every link shows the company's main site and goes to a domain not known as its own.
  allred: 'Offers: <a id="r1" href="https://www.aexp.com/offers">americanexpress.com/offers</a> and <a id="r2" href="https://www.aexp.com/travel">americanexpress.com/travel</a>.'
};
const linkHtml = cloud ? [1,2,3,4].map(i => `<a href="https://oyl6s96s2xyr5tq6mj36.blob.core.windows.net/oyl6s96s2xyr5tq6mj36/link.html#qs=r-${i}ageikagdefbjkd">Message ${i}</a>`).join(' ')
  : LINKS[P.get('links')] || 'Please sign in at <a href="https://example.com/login">example.com</a> today.';
setTimeout(() => {
  document.getElementById('main').innerHTML = `<h2 class="hP" data-thread-perm-id="thread-f:${tid}" data-legacy-thread-id="${Number(tid).toString(16)}">${P.get('subj') || 'Your password expires'}</h2>
  <div class="nH"><div class="adn ads" data-message-id="#msg-f:3001" data-legacy-message-id="${(3001).toString(16)}">
    <div class="aju"><div class="aCi">${P.get('avatar') ? `<img class="ajn" data-hovercard-id="${sender}" src="${P.get('avatar')}" width="40" height="40">` : ''}</div></div>
    <div class="gs">
    <h3 class="iw"><span class="qu"><span class="gD" email="${sender}" name="${sname}">${sname}</span> <span class="go">&lt;${sender.replace(/</g,'&lt;')}&gt;</span></span></h3>
    <div class="a3s aiL"><div class="ii gt"><div>${linkHtml}</div></div></div>
  </div></div>${P.get('with') ? `<div class="adn ads" data-message-id="#msg-f:3002" data-legacy-message-id="${(3002).toString(16)}">
    <h3 class="iw"><span class="qu"><span class="gD" email="${P.get('with')}" name="Colleague">Colleague</span> <span class="go">&lt;${P.get('with')}&gt;</span></span></h3>
    <div class="a3s aiL"><div class="ii gt"><div>My reply.</div></div></div></div>` : ''}</div>`;
}, 300);
// ?listafter=1: leaving the thread shows a Gmail-like inbox list. After a real move the row is gone
// (as in Gmail); window.__back() is "the user pressed Back on their own" and keeps the row. A row
// has no sender spans, so the sender scanners leave it alone; only its thread key matters.
const listAfter = (withRow) => {
  document.getElementById('main').innerHTML = withRow
    ? `<table id="list"><tbody><tr class="zA yO"><td class="oZ-x3"><div role="checkbox" aria-checked="false" tabindex="-1">☐</div></td>
       <td class="xY a4W"><div class="xS"><div class="xT"><div class="y6"><span class="bog"><span data-thread-id="#thread-f:${tid}" data-legacy-thread-id="${Number(tid).toString(16)}">Still here</span></span></div></div></div></td></tr></tbody></table>`
    : '<table id="list"><tbody></tbody></table>';
  location.hash = '#inbox';
};
window.__back = () => listAfter(true);
document.getElementById('spamBtn').addEventListener('click', () => {
  window.__spammed.push('thread-f:' + tid);
  if (P.get('keepspam') === '1') return;              // Gmail ignored the action: nothing moves
  if (P.get('listafter') === '1') { listAfter(false); return; }
  document.getElementById('main').innerHTML = '';
  location.hash = '#inbox';
});
</script></body></html>
