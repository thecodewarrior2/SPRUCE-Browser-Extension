# Runs the unit tests and the browser tests (Playwright, Chromium, simulated webmail pages), and the
# Firefox suite (the Firefox build, made by tools/build.js, in real Firefox: the current ESR and 140 ESR)
# on every push to testing and main and on pull requests into main. The ruleset in
# .github/rulesets/main.json makes the "Unit and browser tests" check required, so a commit reaches main
# only after it passed here (on testing first).
name: Tests
on:
  push:
    branches: [testing, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Unit and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install test dependencies
        # Playwright isn't in package.json (the development container has its own copy); the same
        # version is installed here, with its Chromium.
        run: |
          npm ci
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Unit tests
        run: node --test unit/unit.test.js
      - name: Browser tests
        # GitHub's runners are slower than a desktop: every wait gets 3 times its deadline (a test that
        # passes still finishes as soon as it can).
        env:
          WAIT_SCALE: 3
        run: node run-all.js
      - name: Upload the test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: tests/logs/
          if-no-files-found: ignore
  firefox:
    name: Firefox (${{ matrix.firefox }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        firefox: [esr, '140']
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm ci
      - name: Download Firefox
        run: firefox/get-firefox.sh ${{ matrix.firefox }}
      - name: Firefox suite
        # Builds build/firefox from this commit (tools/build.js) and tests it. GitHub's runners are slower
        # than a desktop: every wait gets 3 times its deadline.
        env:
          WAIT_SCALE: 3
          FXBIN: ${{ github.workspace }}/tests/.firefox/${{ matrix.firefox }}/firefox/firefox
        run: node firefox/run.js
