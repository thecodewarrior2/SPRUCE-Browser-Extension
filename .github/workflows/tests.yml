# Runs the unit tests and the browser tests (Playwright, Chromium, simulated webmail pages), and the
# Firefox suite (the Firefox build, made by tools/build.js, in real Firefox: the current ESR and 140 ESR)
# on every push to testing and main and on pull requests into main. The ruleset in
# .github/rulesets/main.json makes the "Unit and browser tests" check required, so a commit reaches main
# only after it passed here (on testing first).
# Then, for a push to testing, "Release approval" waits for the maintainer: it runs only once they have
# tried the testing build on their own computer and clicked Approve (environment "release", whose
# required reviewer they are). .github/rulesets/main-approval.json lets a commit reach main only after
# that approval succeeded for it. See docs/DEVELOPMENT.md, "Release approval".
name: Tests
on:
  push:
    branches: [testing, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Unit and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install test dependencies
        # Playwright isn't in package.json (the development container has its own copy); the same
        # version is installed here, with its Chromium.
        run: |
          npm ci
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Unit tests
        run: node --test unit/unit.test.js
      - name: Browser tests
        # GitHub's runners are slower than a desktop: every wait gets 3 times its deadline (a test that
        # passes still finishes as soon as it can).
        env:
          WAIT_SCALE: 3
        run: node run-all.js
      - name: Upload the test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: tests/logs/
          if-no-files-found: ignore
  firefox:
    name: Firefox (${{ matrix.firefox }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        firefox: [esr, '140']
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm ci
      - name: Download Firefox
        run: firefox/get-firefox.sh ${{ matrix.firefox }}
      - name: Firefox suite
        # Builds build/firefox from this commit (tools/build.js) and tests it. GitHub's runners are slower
        # than a desktop: every wait gets 3 times its deadline.
        env:
          WAIT_SCALE: 3
          FXBIN: ${{ github.workspace }}/tests/.firefox/${{ matrix.firefox }}/firefox/firefox
        run: node firefox/run.js
  approval:
    name: Release approval
    # Every check above passed on this testing commit; now a person decides.
    needs: [test, firefox]
    if: github.ref == 'refs/heads/testing' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions:
      contents: read
      actions: read
    steps:
      - name: A person must approve (the release environment has a required reviewer)
        # Without a required reviewer GitHub would run this job at once, so the approval would prove
        # nothing: then it fails, and main stays closed to this commit, until the environment is set up.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          if ! n=$(gh api "repos/${{ github.repository }}/environments/release" --jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length'); then
            echo "::error::Could not read the release environment's settings, so this approval can't be shown to come from a person. main stays closed to this commit."
            exit 1
          fi
          if [ "${n:-0}" -lt 1 ]; then
            echo "::error::The release environment has no required reviewer, so this ran without anyone approving it and main stays closed to this commit. Set the environment up as docs/DEVELOPMENT.md describes (Release approval), then re-run this job and approve it."
            exit 1
          fi
      - name: Approved
        run: |
          echo "The maintainer approved ${{ github.sha }} for release."
          echo "main now accepts it: git push origin ${{ github.sha }}:main"
