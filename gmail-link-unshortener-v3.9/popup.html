<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { width: 260px; padding: 15px; font-family: Arial, sans-serif; }
        .center { text-align: center; }
        
        .toggle-container { background: #ffffff; border: 1px solid #dadce0; border-radius: 8px; padding: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .toggle-label { font-size: 12px; font-weight: bold; color: #202124; text-align: left; }
        .toggle-sublabel { font-size: 10px; color: #5f6368; font-weight: normal; margin-top: 2px; }
        
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #34a853; }
        input:checked + .slider:before { transform: translateX(20px); }

        .info-box { font-size: 11px; color: #5f6368; background: #f1f3f4; padding: 10px; border-radius: 4px; margin-bottom: 12px; text-align: left; line-height: 1.6; }
        .sync-text { color: #1a73e8; cursor: pointer; text-decoration: underline; font-weight: bold; display: inline-block; }
        
        .btn-secondary { background-color: #1a73e8; color: white; border: none; padding: 8px 12px; font-size: 11px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; margin-bottom: 15px;}
        .btn-secondary:hover { background-color: #1557b0; }
        
        h5 { margin: 0 0 5px 0; color: #333; }
        .list-container { font-size: 11px; padding: 0; list-style-type: none; max-height: 110px; overflow-y: auto; background: #f1f3f4; border-radius: 4px; margin-bottom: 10px;}
        .list-container li { padding: 6px; border-bottom: 1px solid #ddd; word-wrap: break-word; }
        .list-container li:last-child { border-bottom: none; }
        .btn-clear { background-color: #5f6368; color: white; font-size: 11px; padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; width: 100%; margin-bottom: 15px;}
        .btn-clear:hover { background-color: #3c4043; }
        
        .stat-highlight { color: #d93025; font-weight: bold; }
        .stat-green { color: #004d00; font-weight: bold; }
    </style>
</head>
<body>
    <div class="center">
        <h4 style="margin-top: 0; margin-bottom: 10px;">Link & Pixel Blocker</h4>
        
        <div class="toggle-container">
            <div class="toggle-label">
                Show Visual Highlights
                <div class="toggle-sublabel">Revert text & colors</div>
            </div>
            <label class="switch">
                <input type="checkbox" id="visualToggle" checked>
                <span class="slider"></span>
            </label>
        </div>

        <div class="info-box">
            <div style="border-bottom: 1px solid #ddd; padding-bottom: 6px; margin-bottom: 6px;">
                <div style="font-weight: bold; color: #202124; margin-bottom: 4px;">Current Email Stats:</div>
                <div>Links Cleaned: <span id="linkCount" class="stat-green">0</span></div>
                <div>Tracking Pixels Blocked: <span id="pixelCount" class="stat-highlight">0</span></div>
            </div>
            <div><strong>Synced Trackers:</strong> <span id="syncedCount">Loading...</span></div>
            <div><strong>Domain Policies:</strong> <span id="customCount">0</span> rules</div>
            <div style="margin-top: 4px;"><span id="syncStatus" class="sync-text">Check for updates...</span></div>
        </div>

        <button id="openSettingsBtn" class="btn-secondary">⚙️ Open Settings & Policies</button>
    </div>
    
    <h5>Recent Activity</h5>
    <ul id="activityList" class="list-container"></ul>
    <button id="clearActivityBtn" class="btn-clear" style="display:none;">Clear Activity</button>

    <script src="popup.js"></script>
</body>
</html>
