# Runs the unit tests and the browser tests (Playwright, Chromium, simulated webmail pages) on every
# push to testing and main and on pull requests into main. The ruleset in .github/rulesets/main.json
# makes this check required, so a commit reaches main only after it passed here (on testing first).
name: Tests
on:
  push:
    branches: [testing, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Unit and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        # Playwright isn't in package.json (the development container has its own copy); the same
        # version is installed here, with its Chromium.
        run: |
          npm ci
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Unit tests
        run: node --test unit/unit.test.js
      - name: Browser tests
        run: node run-all.js
      - name: Upload the test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: tests/logs/
          if-no-files-found: ignore
